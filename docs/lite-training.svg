<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="586" viewBox="0 0 1472 586" role="img" aria-labelledby="title desc">
<title id="title">Fold-wise feature selection and linear refitting</title>
<desc id="desc">A teacher combines two Fisher scores. Within each training fold, the absolute teacher coefficient times the feature standard deviation ranks coordinates. The compact classifier combines one quarter refitted full Fisher, one quarter refitted subspace Fisher and one half restricted and recalibrated teacher. Its affine average yields a single classifier.</desc>
